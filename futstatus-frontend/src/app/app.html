<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
</head>
<body>
<h1>Football Players</h1>
<table>
  <tr>
    <th>Name</th>
    <th>Nationality</th>
    <th>Position</th>
  </tr>
  <tr *ngFor="let p of players">
    <td>{{ p.name }}</td>
    <td>{{ p.nationality }}</td>
    <td>{{ p.positions }}</td>
  </tr>
</table>
</body>
</html>
